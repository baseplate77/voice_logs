name: voxsynth
description: "Local-first voice-log synthesizer. Everything on-device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

# NOTE: caret ranges used at bootstrap. After `flutter pub get`, pubspec.lock
# is the source of truth for exact versions. Per IMPLEMENTATION_PLAN.md §0,
# do not let a phase upgrade packages silently — review lock diffs.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State, data, plumbing
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.0
  meta: ^1.16.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Audio capture
  record: ^5.2.0

  # ONNX inference is routed through the Rust crate (voxsynth_asr) via
  # sherpa-rs → sherpa-onnx → ORT. Adding the `onnxruntime` pub.dev plugin
  # alongside that causes 21 duplicate-symbol errors at iOS link time
  # because both ship the full ORT C++/ObjC runtime. Silero VAD + e5
  # embeddings will be exposed through voxsynth_asr once we wire them.

  # LLM — flutter_gemma is deferred to Phase 3. Its MediaPipe pods ship
  # abseil statically, which segfaults during static init when linked
  # alongside sherpa-onnx's own abseil copy (FlagImpl::SetCallback null
  # deref). We'll resolve the dual-abseil issue when we actually need
  # Gemma inference; for now, get the ASR path shipping end-to-end.
  # flutter_gemma: ^0.9.0

  # FFI (Whisper)
  ffi: ^2.1.3

  # Storage — Drift (SQLite + FTS5) with SQLCipher.
  # `drift_flutter` and `sqflite` are excluded: both pull sqlite3_flutter_libs,
  # which collides with sqlcipher_flutter_libs (duplicate Sqlite3FlutterLibsPlugin
  # on iOS). Open drift databases manually via NativeDatabase + sqlite3.
  drift: ^2.20.3
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.5

  # Storage — ObjectBox (vector index)
  objectbox: ^4.0.3
  objectbox_flutter_libs: ^4.0.3

  # Secrets at rest (DB keys)
  flutter_secure_storage: ^9.2.2

  # Background jobs. 0.5.2 still uses Flutter v1 Android embedding
  # (ShimPluginRegistry / PluginRegistrantCallback), which Flutter 3.29+
  # removed — bump to 0.9.x for v2 embedding.
  workmanager: ^0.9.0

  # Runtime permissions
  permission_handler: ^11.3.1

  # Logging
  logger: ^2.5.0

  # ASR — Rust crate (sherpa-rs + Parakeet) bridged via flutter_rust_bridge.
  voxsynth_asr:
    path: rust_builder
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  objectbox_generator: ^4.0.3

  # Test utils
  mocktail: ^1.0.4

# record 5.2.1 resolves record_linux 0.7.2, which predates
# record_platform_interface 1.5.0 and is missing `startStream`. VoxSynth
# doesn't target Linux, but Flutter still analyzes all platform
# implementations — force a compatible record_linux.
dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/fixtures/
