name: voxsynth
description: "Local-first voice-log synthesizer. Everything on-device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

# Caret ranges at bootstrap. After `flutter pub get`, pubspec.lock is the
# source of truth for exact versions. Per CLAUDE.md, do not let a phase
# upgrade packages silently — review lock diffs.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State, data, plumbing
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  collection: ^1.19.0
  meta: ^1.16.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Audio capture
  record: ^5.2.0

  # Audio playback for recorded WAV files on the detail screen. Pinned to
  # 0.9.x — that line is the long-standing stable channel and exposes the
  # `positionStream` we use for word-level transcript highlighting.
  just_audio: ^0.9.42

  # STT — Parakeet via k2-fsa/sherpa-onnx Flutter bindings. Native libs
  # ship with the plugin; model files in assets/models/parakeet/.
  sherpa_onnx: ^1.12.39

  # Embeddings — e5-small-v2 QInt8 ONNX via flutter_onnxruntime.
  flutter_onnxruntime: ^1.7.0

  # LLM — Gemma 3 1B IT Q4 LiteRT-LM. The bundle lives in
  # assets/models/gemma/Gemma3-1B-IT_multi-prefill-seq_q4_ekv4096.litertlm
  # and is installed from asset into flutter_gemma's private model store.
  flutter_gemma: ^0.13.6

  # Storage — Drift (SQLite + FTS5) with SQLCipher via SQLite3MultipleCiphers.
  # `sqlite3` 3.x uses Dart build hooks (see `hooks:` block below) to bundle
  # the native library. sqlite-vec extension loading is deferred to Phase 3
  # (see IMPLEMENTATION_PLAN.md) — no vec dep in Phase 0.
  drift: ^2.32.0
  sqlite3: ^3.1.0

  # Secrets at rest (DB keys)
  flutter_secure_storage: ^9.2.2

  # Background jobs — workmanager on Android, BGTaskScheduler via platform
  # channel on iOS (channel wired in Phase 6).
  workmanager: ^0.9.0

  # Runtime permissions
  permission_handler: ^11.3.1

  # Lightweight key-value prefs (auto-record toggle, onboarding flag)
  shared_preferences: ^2.5.3

  # Logging
  logger: ^2.5.0

  # Local-only reminder notifications for extracted action items.
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Encrypted backup pipeline (settings → Export/Import). Everything runs
  # locally; share_plus / file_picker only route bytes through the OS
  # share sheet and document picker — no network.
  pointycastle: ^3.9.1
  archive: ^4.0.2
  share_plus: ^10.1.4
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.13
  drift_dev: ^2.32.0
  freezed: ^3.2.5
  json_serializable: ^6.8.0

  # Test utils
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

# record 5.2.1 resolves record_linux 0.7.2, which predates
# record_platform_interface 1.5.0 and is missing `startStream`. VoxSynth
# targets iOS+Android only, but Flutter still analyzes all platform
# implementations — force a compatible record_linux.
#
# path_provider_android 2.3.x rewrote the plugin atop the `jni` FFI
# package, which races with Flutter engine attachment and throws
# "No JNI instance is available" on first call during the initial
# frame build (see stack trace from 2026-04-22). Pin to the last 2.2.x
# release — MethodChannel-backed, no JNI race.
dependency_overrides:
  record_linux: ^1.0.0
  path_provider_android: 2.2.23

# `package:sqlite3` 3.x uses Dart build hooks to bundle its native library
# instead of a separate Flutter plugin. Selecting `sqlite3mc` swaps plain
# SQLite for SQLite3MultipleCiphers, which speaks the SQLCipher wire format
# — the v2 encryption plan (keys via flutter_secure_storage) lives on top
# of this. Wiring arrives in Phase 2; the hook is declared here so the
# build picks the right binary from day one.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    # Flutter asset handling is not recursive — listing a directory only
    # bundles files directly inside it. Each model subdir is enumerated
    # separately.
    - assets/models/silero_vad.onnx
    - assets/models/parakeet/
    - assets/models/zipformer_en_20m/encoder-epoch-99-avg-1.int8.onnx
    - assets/models/zipformer_en_20m/decoder-epoch-99-avg-1.onnx
    - assets/models/zipformer_en_20m/joiner-epoch-99-avg-1.int8.onnx
    - assets/models/zipformer_en_20m/tokens.txt
    - assets/models/e5/
    # Gemma 3 1B IT Q4 LiteRT-LM production LLM. The directory is git-ignored
    # and populated manually after accepting the gated HF license.
    - assets/models/gemma/
    # Bench fixture — 60s 16 kHz mono PCM16 used by integration_test/stt_bench.dart.
    # Resampled from test_data/record_out.wav. Bundled so integration_test can
    # read it via rootBundle.
    - test_data/record_out_16k.wav
    # Refine eval fixture (50 cases) used by the in-app refine eval debug
    # screen and the fixture-shape test in test/features/refine/.
    - assets/eval/refine_eval_cases.json
