name: voxsynth
description: "Local-first voice-log synthesizer. Everything on-device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

# NOTE: caret ranges used at bootstrap. After `flutter pub get`, pubspec.lock
# is the source of truth for exact versions. Per IMPLEMENTATION_PLAN.md §0,
# do not let a phase upgrade packages silently — review lock diffs.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State, data, plumbing
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  collection: ^1.19.0
  meta: ^1.16.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Audio capture
  record: ^5.2.0

  # ONNX inference is routed through the Rust crate (voxsynth_asr) via
  # sherpa-rs → sherpa-onnx → ORT. Adding the `onnxruntime` pub.dev plugin
  # alongside that causes 21 duplicate-symbol errors at iOS link time
  # because both ship the full ORT C++/ObjC runtime. Silero VAD + e5
  # embeddings will be exposed through voxsynth_asr once we wire them.

  # LLM — flutter_gemma (MediaPipe) drives Gemma 3 inference. Model is
  # downloaded on first use from the litert-community HF repo via the
  # plugin's own ModelFileManager; no .task file is bundled in assets.
  # Historical note: when this file also bundled sherpa-onnx-iOS via
  # flutter_rust_bridge, both pods statically linked abseil and
  # segfaulted during static init. Not a concern on Android; iOS fix
  # if we re-enable that platform is `:abseil_shared` or vendored pods.
  flutter_gemma: ^0.13.5

  # FFI (Whisper)
  ffi: ^2.1.3

  # Storage — Drift (SQLite + FTS5) with SQLCipher via SQLite3MultipleCiphers.
  # `sqlite3` 3.x uses Dart build hooks (see the top-level `hooks:` block)
  # to bundle the native library — `sqlcipher_flutter_libs` is gone
  # (end-of-life at 0.7.0). `drift_flutter` and `sqflite` are still
  # excluded: neither is needed now that sqlite3 ships its own binaries.
  drift: ^2.32.0
  sqlite3: ^3.1.0

  # Storage — ObjectBox (vector index)
  objectbox: ^5.3.0
  objectbox_flutter_libs: ^5.3.0

  # Secrets at rest (DB keys)
  flutter_secure_storage: ^9.2.2

  # Background jobs. 0.5.2 still uses Flutter v1 Android embedding
  # (ShimPluginRegistry / PluginRegistrantCallback), which Flutter 3.29+
  # removed — bump to 0.9.x for v2 embedding.
  workmanager: ^0.9.0

  # Runtime permissions
  permission_handler: ^11.3.1

  # Logging
  logger: ^2.5.0

  # ASR — Rust crate (sherpa-rs + Parakeet) bridged via flutter_rust_bridge.
  voxsynth_asr:
    path: rust_builder
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.13
  drift_dev: ^2.32.0
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  objectbox_generator: ^5.3.0

  # Test utils
  mocktail: ^1.0.4

# record 5.2.1 resolves record_linux 0.7.2, which predates
# record_platform_interface 1.5.0 and is missing `startStream`. VoxSynth
# doesn't target Linux, but Flutter still analyzes all platform
# implementations — force a compatible record_linux.
dependency_overrides:
  record_linux: ^1.0.0

# `package:sqlite3` 3.x uses Dart build hooks to bundle its native
# library instead of the old `sqlcipher_flutter_libs` plugin. Selecting
# `sqlite3mc` swaps plain SQLite for SQLite3MultipleCiphers, which
# speaks the SQLCipher wire format — keeping our existing on-disk
# database files and `PRAGMA key` flow intact (the `cipher = 'sqlcipher'`
# pragma is now set explicitly in `lib/store/database_factory.dart`).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    # Flutter's asset handling is *not* recursive — listing a directory
    # only bundles files directly inside it, not subdirectories. The
    # Rust-backed runners (Parakeet, e5, Gemma) each live in their own
    # subdir, so those must be enumerated separately.
    #
    # The top-level `assets/models/` is intentionally *not* listed: the
    # files sitting there (silero_vad.onnx, multilingual-e5-small-int8.onnx,
    # ggml-small-q8_0.bin) are unused — Silero is a stub (see
    # push_to_talk_processor.dart), and e5/whisper models are served
    # from their own subdirs.
    - assets/models/parakeet/
    - assets/models/e5/
    # Gemma 4 E2B lives in assets now — HF CDN downloads at 2.58 GB
    # hit WorkManager's task-timeout ceiling on device. The file is
    # git-ignored (see .gitignore line 62) so each dev drops it in
    # manually. flutter_gemma copies it out of the APK on first run
    # via its AssetSourceHandler (same path the Parakeet/E5 copy uses
    # in `model_bootstrap.dart`).
    - assets/models/gemma/gemma-4-E2B-it.litertlm
    - assets/fixtures/
