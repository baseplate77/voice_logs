[package]
name = "voxsynth_asr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"

# sherpa-rs wraps the C++ sherpa-onnx runtime. Handles Parakeet-TDT
# encoder/decoder/joiner inference + transducer beam search for us.
sherpa-rs = "0.6"

# candle — pure-Rust ML inference. Used by api/embed.rs for the e5
# xlm-roberta embedder. Gemma LLM inference was previously here too
# but moved to the Flutter side (flutter_gemma / MediaPipe) — the
# quantized_gemma3 module is no longer referenced.
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Used by api/embed.rs to parse the e5 config.json.
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
