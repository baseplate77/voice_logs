# Ensure libvoxsynth_asr.dylib can find its sidecar dylibs
# (libsherpa-onnx-c-api.dylib, libonnxruntime.1.17.1.dylib) that sherpa-rs-sys
# emits into the same target/{debug,release}/ directory. Without `@loader_path`
# in the rpath, dyld only searches the default system paths and fails.
#
# Mobile builds use static linkage via cargokit, so this rpath is a no-op there
# and harmless. Linux uses $ORIGIN which is the equivalent runtime marker.

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path"]

[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

# candle → gemm-f16 → uses ARMv8.2 fullfp16 SIMD. The default Android
# arm64-v8a target is ARMv8-A baseline without fp16 support, so the
# build fails with "instruction requires: fullfp16". All Android 7+
# phones that can run a ~770 MB LLM at all are ARMv8.2+; enabling the
# feature is safe in practice and matches what candle's own iOS builds
# assume.
[target.aarch64-linux-android]
rustflags = [
    "-C", "target-feature=+fp16,+fullfp16",
]
[target.aarch64-apple-ios]
rustflags = [
    "-C", "target-feature=+fp16,+fullfp16",
]
[target.aarch64-apple-ios-sim]
rustflags = [
    "-C", "target-feature=+fp16,+fullfp16",
]
